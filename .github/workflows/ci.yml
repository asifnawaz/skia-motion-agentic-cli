name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identify the FFmpeg package cache
        id: ffmpeg-image
        run: printf 'key=%s-%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache Ubuntu FFmpeg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/skac/ffmpeg-debs
          key: ffmpeg-debs-v1-${{ runner.arch }}-${{ steps.ffmpeg-image.outputs.key }}
      - name: Set up FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            cache="$HOME/.cache/skac/ffmpeg-debs"
            shopt -s nullglob
            packages=("$cache/"*.deb)
            if (( ! ${#packages[@]} )); then
              archives="$RUNNER_TEMP/ffmpeg-archives"
              mkdir -p "$archives" "$cache"
              sudo apt-get -o Acquire::Languages=none update
              sudo apt-get -o "Dir::Cache::archives=$archives" \
                install --download-only --no-install-recommends -y ffmpeg
              cp "$archives/"*.deb "$cache/"
              packages=("$cache/"*.deb)
            fi
            sudo apt-get install --no-download --no-install-recommends -y "${packages[@]}"
          fi
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/remotion
          key: e2e-${{ runner.os }}-${{ hashFiles('templates/init/package.json') }}
          restore-keys: e2e-${{ runner.os }}-
      - run: npm ci || npm install
      - run: npm run test:e2e
        env:
          SKIA_MOTION_E2E_PROJECT: ''
          SKAC_GL: swangle
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-output
          path: |
            ${{ runner.temp }}/**/*.mp4
            ${{ runner.temp }}/**/sheet.png
          if-no-files-found: ignore
