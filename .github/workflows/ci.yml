name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  scope:
    name: Check rendering impact
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.changes.outputs.render }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths="$RUNNER_TEMP/changed-paths"
          if [[ -z "$BASE_SHA" ]] ||
             { ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
               ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; } ||
             ! git diff --name-only --no-renames -z "$BASE_SHA" "$GITHUB_SHA" -- > "$paths"; then
            printf '%s\n' 'render=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/*|.releaserc.json|README.md|docs/README.md|packages/runtime/package.json|scripts/pack-runtime.js|test/unit/*)
                ;;
              *)
                printf '%s\n' 'render=true' >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done < "$paths"
          printf '%s\n' 'render=false' >> "$GITHUB_OUTPUT"

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - run: npm run test:unit

  e2e:
    needs: scope
    if: needs.scope.outputs.render == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identify the FFmpeg package cache
        id: ffmpeg-image
        run: printf 'key=%s-%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache Ubuntu FFmpeg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/skac/ffmpeg-debs
          key: ffmpeg-debs-v1-${{ runner.arch }}-${{ steps.ffmpeg-image.outputs.key }}
      - name: Set up FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            cache="$HOME/.cache/skac/ffmpeg-debs"
            shopt -s nullglob
            packages=("$cache/"*.deb)
            if (( ! ${#packages[@]} )); then
              # APT creates a restricted partial directory. Keep it outside
              # the runner's artifact search and let _apt reach the archives.
              archives="$(mktemp -d /tmp/skac-ffmpeg.XXXXXX)"
              chmod 755 "$archives"
              mkdir -p "$cache"
              sudo apt-get -o Acquire::Languages=none update
              sudo apt-get -o "Dir::Cache::archives=$archives" \
                install --download-only --no-install-recommends -y ffmpeg
              cp "$archives/"*.deb "$cache/"
              packages=("$cache/"*.deb)
            fi
            # APT still acquires local files. Disable repositories for this
            # install so it can read the cached files without using the network.
            sudo apt-get -o Dir::Etc::sourcelist=/dev/null -o Dir::Etc::sourceparts=- \
              install --no-install-recommends -y "${packages[@]}"
          fi
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/remotion
          key: e2e-${{ runner.os }}-${{ hashFiles('templates/init/package.json') }}
          restore-keys: e2e-${{ runner.os }}-
      - run: npm ci || npm install
      - run: npm run test:e2e
        env:
          SKIA_MOTION_E2E_PROJECT: ''
          SKAC_GL: swangle
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-output
          path: |
            ${{ runner.temp }}/**/*.mp4
            ${{ runner.temp }}/**/sheet.png
          if-no-files-found: ignore
